---
name: Lint

on: # yamllint disable-line rule:truthy
  push: null
  pull_request: null

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {} # yamllint disable-line rule:braces

jobs:
  build:
    name: Lint
    runs-on: ubuntu-latest

    permissions:
      contents: read # to clone the repository
      packages: read # to pull linter images/dependencies
      issues: write # to write lint results as issue/PR comments
      pull-requests: write # to write lint results as PR comments
      statuses: write # to report GitHub Actions status checks

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          # super-linter needs the full git history to get the
          # list of files that changed across commits
          fetch-depth: 0
          persist-credentials: false

      - name: Super-linter
        uses: super-linter/super-linter@4ce20838b8ab83717e78138c5b3a1407148e0918 # v8.7.0
        env:
          # To report GitHub Actions status checks
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FILTER_REGEX_EXCLUDE: '\.serena/|\.claude/'
          LOG_LEVEL: DEBUG
